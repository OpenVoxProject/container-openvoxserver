---
:global:
  matrix_command: bash matrix.sh build
  matrix_requires_yq: true
  build_runner: '${{ matrix.runner }}'
  build_file: 'Containerfile.${{ matrix.os }}'
  image_tag: 'ci/openvoxserver:${{ matrix.server_version }}-${{ matrix.os }}-${{ matrix.platform }}'
  build_platforms: 'linux/${{ matrix.platform }}'
  build_args:
    - 'OPENVOX_RELEASE=${{ matrix.release }}'
    - 'OPENVOXSERVER_VERSION=${{ matrix.server_version }}'
    - 'OPENVOXDB_VERSION=${{ matrix.db_version }}'
    - 'RUBYGEM_OPENVOX=${{ matrix.rubygem_openvox }}'
    - 'RUBYGEM_R10K=${{ matrix.rubygem_r10k }}'
    - 'RUBYGEM_RUGGED=${{ matrix.rubygem_rugged }}'
    - 'JDK_VERSION=${{ matrix.jdk_version }}'
.github/renovate.jsonc:
  renovate_custom_managers:
    - customType: regex
      datasourceTemplate: rubygems
      managerFilePatterns:
        - /(^|/)Containerfile\.(?:alpine|ubuntu)$/
        - /(^|/)build_versions\.yaml$/
      matchStrings:
        - >-
          rubygem_(?<depName>[a-z0-9_-]+):\s*"(?<currentValue>\d+\.\d+\.\d+)"
        - >-
          #\s*renovate:\s*datasource=rubygems\s+depName=(?<depName>[a-z0-9_-]+)\s*\n\s*ARG\s+RUBYGEM_[A-Z0-9_]+=(?<currentValue>\d+\.\d+\.\d+)
    - customType: regex
      datasourceTemplate: github-tags
      extractVersionTemplate: '^v(?<version>\d+\.\d+\.\d+)$'
      managerFilePatterns:
        - /(^|/)Containerfile\.(?:alpine|ubuntu)$/
      matchStrings:
        - >-
          #\s*renovate:\s*datasource=github-tags\s+depName=(?<depName>OpenVoxProject/puppetlabs-[a-z0-9_]+)\s*\n\s*ARG\s+MODULE_[A-Z0-9_]+=(?<currentValue>\d+\.\d+\.\d+)
    - customType: regex
      managerFilePatterns:
        - /(^|/)Containerfile\.(?:alpine|ubuntu)$/
        - /(^|/)build_versions\.yaml$/
      matchStrings:
        - >-
          #\s*renovate:\s*datasource=(?<datasource>custom\.voxpupuli-artifacts)\s+depName=(?<depName>openvox(?:-server|db))\s*\n\s*(?:ARG\s+OPENVOX(?:SERVER|DB)_VERSION=|(?:server|db)_version:\s*")(?<currentValue>\d+\.\d+\.\d+)
      versioningTemplate: semver
  renovate_custom_datasources:
    voxpupuli-artifacts:
      defaultRegistryUrlTemplate: 'https://artifacts.voxpupuli.org/{{packageName}}/'
      format: html
  renovate_package_rules:
    - matchDatasources:
        - custom.voxpupuli-artifacts
      extractVersion: '^(?<version>\d+\.\d+\.\d+)/$'
    # Each OpenVox major release has its own build line in build_versions.yaml,
    # and the Containerfile defaults are pinned to one of those lines. Keep every
    # pinned version within its major; new majors get a new build line by hand.
    - matchPackageNames:
        - openvox
        - openvox-server
        - openvoxdb
      matchUpdateTypes:
        - major
      enabled: false
.github/workflows/ci.yml:
  build_job_name: 'Build OpenVox ${{ matrix.release }} ${{ matrix.os }} / ${{ matrix.platform }} CI container'
  test_commands:
    - >-
      docker run --rm -v "$PWD/tests:/tests:ro,Z" --entrypoint puppet
      ci/openvoxserver:${{ matrix.server_version }}-${{ matrix.os }}-${{ matrix.platform }}
      catalog compile --manifest /tests/simple_catalog.pp --render-as json > catalog.json
    - grep -q '"type":"Host"' catalog.json
    - grep -q '"type":"Cron"' catalog.json
.github/workflows/security_scanning.yml:
  scan_job_name: 'Scan OpenVox ${{ matrix.release }} ${{ matrix.os }} / ${{ matrix.platform }} container'
  sarif_category: 'grype-${{ matrix.os }}-${{ matrix.platform }}'
.github/workflows/build_container.yml:
  publish_tag_patterns:
    - 'v*'
  publish_build_job_name: 'Build OpenVox Server ${{ matrix.server_version }} (${{ matrix.os }}/${{ matrix.platform }})'
  publish_build_arch: 'linux/${{ matrix.platform }}'
  publish_tags:
    - 'ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}-${{ github.sha }}-${{ matrix.os }}-${{ matrix.platform }}'
  publish_manifest_matrix_command: bash matrix.sh tag
  publish_manifest_steps:
    - name: Create build manifest
      if: "${{ github.ref == 'refs/heads/main' }}"
      commands:
        - set -euo pipefail
        - 'version="${{ matrix.server_version }}"'
        - 'ghcr_tags=$(skopeo list-tags docker://ghcr.io/openvoxproject/openvoxserver)'
        - 'hub_tags=$(skopeo list-tags docker://docker.io/voxpupuli/openvoxserver)'
        - 'last_tag=$(echo "$ghcr_tags" "$hub_tags" | jq -r ".Tags[]" | { grep -E "^${version//./\\.}-[0-9]+$" || true; } | cut -d- -f2 | sort -n | tail -1)'
        - 'this_build=$(skopeo inspect --format "{{.Digest}}" docker://ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}-${{ github.sha }}-ubuntu-amd64)'
        - 'if [ -z "$last_tag" ]; then'
        - '  next_sequence=0'
        - 'else'
        - '  last_index=$(skopeo inspect --raw "docker://ghcr.io/openvoxproject/openvoxserver:$version-$last_tag" || true)'
        - '  if grep -qF "$this_build" <<<"$last_index"; then next_sequence=$last_tag; else next_sequence=$((last_tag + 1)); fi'
        - 'fi'
        - >-
          docker buildx imagetools create
          --annotation "index:org.opencontainers.image.revision=${{ github.sha }}"
          -t ghcr.io/openvoxproject/openvoxserver:${{ matrix.server_version }}-$next_sequence
          -t ghcr.io/openvoxproject/openvoxserver:${{ matrix.server_version }}
          -t ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}
          -t docker.io/voxpupuli/openvoxserver:${{ matrix.server_version }}-$next_sequence
          -t docker.io/voxpupuli/openvoxserver:${{ matrix.server_version }}
          -t docker.io/voxpupuli/openvoxserver:${{ matrix.release }}
          ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}-${{ github.sha }}-ubuntu-arm64
          ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}-${{ github.sha }}-ubuntu-amd64
        - >-
          docker buildx imagetools create
          --annotation "index:org.opencontainers.image.revision=${{ github.sha }}"
          -t ghcr.io/openvoxproject/openvoxserver:${{ matrix.server_version }}-$next_sequence-alpine
          -t ghcr.io/openvoxproject/openvoxserver:${{ matrix.server_version }}-alpine
          -t ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}-alpine
          -t docker.io/voxpupuli/openvoxserver:${{ matrix.server_version }}-$next_sequence-alpine
          -t docker.io/voxpupuli/openvoxserver:${{ matrix.server_version }}-alpine
          -t docker.io/voxpupuli/openvoxserver:${{ matrix.release }}-alpine
          ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}-${{ github.sha }}-alpine-arm64
          ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}-${{ github.sha }}-alpine-amd64
        - 'echo "Published $version-$next_sequence and $version-$next_sequence-alpine from ${{ github.sha }}" >> "$GITHUB_STEP_SUMMARY"'
    - name: Update floating Ubuntu tag
      if: "${{ github.ref == 'refs/heads/main' && matrix.release=='9' }}"
      commands:
        - >-
          docker buildx imagetools create
          -t ghcr.io/openvoxproject/openvoxserver:latest
          -t docker.io/voxpupuli/openvoxserver:latest
          ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}-${{ github.sha }}-ubuntu-arm64
          ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}-${{ github.sha }}-ubuntu-amd64
    - name: Update floating Alpine tag
      if: "${{ github.ref == 'refs/heads/main' && matrix.release=='9' }}"
      commands:
        - >-
          docker buildx imagetools create
          -t ghcr.io/openvoxproject/openvoxserver:latest-alpine
          -t docker.io/voxpupuli/openvoxserver:latest-alpine
          ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}-${{ github.sha }}-alpine-arm64
          ghcr.io/openvoxproject/openvoxserver:${{ matrix.release }}-${{ github.sha }}-alpine-amd64
  dockerhub_repository: voxpupuli/openvoxserver
